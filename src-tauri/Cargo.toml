[package]
name = "story-studio"
version = "0.1.0"
description = "Story Studio · AI 小说创作（桌面壳）"
authors = ["cafero"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
# A2 追加本地代理依赖时 TLS 用 reqwest 默认 native-tls（Windows=Schannel，
# 免 C 编译链），不用 rustls/ring——实测 ring 的 build-script exe 会被杀软拦。
